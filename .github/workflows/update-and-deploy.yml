name: Update top episodes and deploy

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt "Pillow>=10.0.0"

      - name: Build top episodes CSV
        env:
          MIN_VOTES: "100"
          TOP_N: "100000"
        run: python scraper/fetch_top_episodes.py

      - name: Verify data was generated
        run: ls -la data/top_episodes_*.csv

      - name: Gzip CSV chunks for site
        run: |
          for f in data/top_episodes_*.csv; do
            gzip -c "$f" > "site/$(basename "$f").gz"
          done

      - name: Generate OG image
        run: python generate_og_image.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
